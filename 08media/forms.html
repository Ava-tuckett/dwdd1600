        <h1>Order Ferret merch here</h1>
        
        <form method="get" class="myForm" action="thanks.html">
        <fieldset>
         <legend>Customer Information </legend>
         <label> First Name*<input type="text" name="fname" required></label>
         <label> Last Name*<input type="text" name="lname" required></label>
         <label> Cell number*<input type="text" name="phone" required></label>
         <label> Email*<input type="text" name="email" required></label>
         </fieldset>

         <fieldset>
            <legend>Delivery Method</legend>
                <label><input type="radio" name="method" value="Amazon">Amazon Delivery</label>
                <label><input type="radio" name="method" value="UPS"> UPS Delivery</label>
                <label><input type="radio" name="method" value="FedEx"> FedEx</label>
            </fieldset>

            <fieldset>
            <legend>Delivery Options</legend>
                <label><input type="checkbox" name="porch" value="yes"> Front Porch</label>
                <label><input type="checkbox" name="deck" value="yes"> Back Deck</label>
                <label><input type="checkbox" name="driveway" value="yes"> Driveway</label>
                <label><input type="checkbox" name="garage" value="yes"> Inside the Garage</label>

                <label>Preferred Delivery Time
                <select name="time">
                <option value="none">Please Select</option>
                <option value="overnight">Overnight</option>
                <option value="2days">2 Days</option>
                <option value="3days">3 Days</option>
                <option value="N/A">N/A</option>
                </select>
                </label>

            </fieldset>
            
            <label>Comments
                <textarea name="comments"></textarea>
            </label>



            <input type="submit" value="Send Delivery Request">
